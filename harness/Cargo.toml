[workspace]
members = [".", "crates/tools", "crates/utils", "crates/wakeup"]
default-members = [".", "crates/tools", "crates/utils", "crates/wakeup"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"

[workspace.dependencies]
bon = "3.9"
itertools = "0.15"
rayon = "1.12"
strum = { version = "0.28", features = ["derive"] }
tap = "1.0"

[package]
name = "harness"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "A small, backend-agnostic harness for tool-using LLM agents"
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = "0.1"
bon.workspace = true
llm = { path = "../llm" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tools = { path = "crates/tools" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
