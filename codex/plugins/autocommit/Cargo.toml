[package]
name = "codex-autocommit"
version = "0.1.0"
edition = "2024"
description = "Batch changes from overlapping Codex sessions into automatic Git commits"
license = "MIT"

[dependencies]
fs2 = "0.4"
libc = "0.2"
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
